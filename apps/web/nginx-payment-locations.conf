# Payment-attempt HTTP transport enabled (VITE_COMMERCE_PAYMENTS_ENABLED).
#
# EXACTLY the five frozen PAYMENT_ROUTES from
# packages/shared/src/commerce/control-payment-capabilities.ts, one nginx
# location per route, across two strictly disjoint audiences (1 browser
# `commerce_payment_terms` + 4 agent `commerce_payment_attempt`):
#   POST /v2/provider/organizations/:organizationId/listings/:listingId/versions/:version/payment-terms
#   POST /v2/agent/commerce-payment-requirements
#   POST /v2/agent/commerce-payment-attempts
#   POST /v2/agent/commerce-payment-attempts/:attemptId/dispatch
#   GET  /v2/agent/commerce-payment-attempts/:attemptId
#
# No frozen path is mixed-method, so there is no `error_page 418` dispatch and
# no named location. There is NO observation route: the post-dispatch recorder
# is migrator-private.
#
# TWO CREDENTIAL NAMESPACES, ONE PER AUDIENCE:
#
#   * agent   (`/v2/agent/commerce-payment...`) - EXACTLY the `oacs_v1_`
#     commerce-session bearer. `oas_ag_` is deliberately NOT accepted: it is the
#     read-only machine credential that is exchanged for a commerce session and
#     it can never authorize spending. The three agent writes carry their own
#     canonical ids as the replay key, so an Idempotency-Key is rejected.
#   * browser (`/v2/provider/organizations/...`) - the seller browser session
#     cookie with the `X-OpenArc-Client` marker, Origin, Fetch-Metadata, a
#     required `X-OpenArc-CSRF` and a required Idempotency-Key. `Authorization`
#     and `Proxy-Authorization` are rejected outright with 403.
#
# Every route rejects a literal `?` by matching the original `$request_uri`. A
# regex/exact `proxy_pass` here carries NO URI component, so nginx preserves the
# original encoded request target exactly once for the API to decode. The API
# stays the authority for cookie, exact Origin, CSRF, bearer grammar and
# duplicate raw-header checks.
#
# Enabling this transport signs, sends and settles nothing.

# --- Seller terms record: POST only, query-free, JSON + CSRF + idempotency ----
location ~ "^/v2/provider/organizations/openarc:org:[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/listings/openarc:listing:[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/versions/[1-9][0-9]{0,8}/payment-terms$" {
  if ($request_method != POST) { return 405; }
  if ($http_authorization != "") { return 403; }
  if ($http_proxy_authorization != "") { return 403; }
  if ($request_uri ~ "\?") { return 400; }
  if ($http_content_type !~ "^application/json(; *charset=utf-8)?$") { return 415; }
  if ($http_transfer_encoding != "") { return 400; }
  if ($http_x_openarc_csrf = "") { return 400; }
  if ($http_idempotency_key = "") { return 400; }
  client_max_body_size 16k;
  include /etc/nginx/tenant_write_proxy_params;
  include /etc/nginx/market_response_headers;
  proxy_pass https://${API_UPSTREAM_HOST};
}

# --- Agent requirement register: POST only, exact path, exact oacs_v1_ -------
location = /v2/agent/commerce-payment-requirements {
  if ($request_method != POST) { return 405; }
  if ($request_uri != "/v2/agent/commerce-payment-requirements") { return 400; }
  if ($http_cookie != "") { return 403; }
  if ($http_origin != "") { return 403; }
  if ($http_sec_fetch_site != "") { return 403; }
  if ($http_sec_fetch_mode != "") { return 403; }
  if ($http_sec_fetch_dest != "") { return 403; }
  if ($http_sec_fetch_user != "") { return 403; }
  if ($http_x_openarc_client != "") { return 403; }
  if ($http_x_openarc_csrf != "") { return 403; }
  if ($http_proxy_authorization != "") { return 403; }
  if ($http_x_openarc_proxy_secret != "") { return 403; }
  if ($http_authorization !~ "^Bearer oacs_v1_[A-Za-z0-9_-]{43}$") { return 403; }
  if ($http_content_type !~ "^application/json(; *charset=utf-8)?$") { return 415; }
  if ($http_transfer_encoding != "") { return 400; }
  if ($http_idempotency_key != "") { return 400; }
  client_max_body_size 16k;
  include /etc/nginx/commerce_agent_proxy_params;
  proxy_pass_request_body on;
  proxy_set_header Content-Type $http_content_type;
  proxy_set_header Content-Length $http_content_length;
  include /etc/nginx/market_response_headers;
  proxy_pass https://${API_UPSTREAM_HOST};
}

