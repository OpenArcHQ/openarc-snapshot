# Authorization-grant HTTP transport enabled (VITE_COMMERCE_GRANTS_ENABLED).
#
# EXACTLY the nine frozen GRANT_ROUTES from
# packages/shared/src/commerce/control-grant-capabilities.ts, one nginx location
# per route, across three strictly disjoint audiences (3 agent
# `commerce_grant_authorization` + 3 provider `commerce_grant_claim` + 3 browser
# `commerce_grant_management`):
#   POST /v2/agent/commerce-grants
#   POST /v2/agent/commerce-grants/:grantId/replace
#   GET  /v2/agent/commerce-grant-mutations/:mutationId
#   POST /v2/provider/grants/introspect
#   POST /v2/provider/grants/claim
#   GET  /v2/provider/grant-attempts/:attemptId
#   GET  /v2/control/organizations/:organizationId/grants/:grantId
#   GET  /v2/control/organizations/:organizationId/grant-mutations/:mutationId
#   POST /v2/control/organizations/:organizationId/grants/:grantId/revoke
#
# No route in the frozen registry shares a path across GET and POST, so this
# family declares NO `error_page 418 = @name` dispatch and NO named location:
# every one of the nine routes is a single externally addressable location with
# one pinned method. A named dispatch here would be dead configuration. (The
# accepted commerce-session and policy-management families do carry one, because
# their collections really are mixed-method.)
#
# THREE CREDENTIAL NAMESPACES, ONE PER AUDIENCE. They are not interchangeable
# and copying one guard onto another audience inverts the policy in both
# directions:
#
#   * agent    (`/v2/agent/commerce-grant...`) - EXACTLY the `oacs_v1_`
#     commerce-session bearer, the same credential the accepted commerce-ACTION
#     agent routes require. `oas_ag_` is deliberately NOT accepted here: it is
#     the read-only machine credential that is EXCHANGED for a commerce session
#     at `/v2/agent/commerce-sessions/exchange`, and it can never authorize
#     spending. The accepted session exchange keeps `oas_ag_` because that is
#     where the machine credential is presented; every surface that CONSUMES a
#     commerce session requires `oacs_v1_`.
#   * provider (`/v2/provider/grant...`) - the `oas_pr_` provider session
#     bearer, the machine provider namespace from the accepted machine session
#     token grammar (43 canonical base64url characters). A provider route
#     accepts NEITHER `oacs_v1_` NOR `oas_ag_` NOR a browser cookie. The SECOND
#     provider factor - the buyer's exact one-use `oag_v1_` grant token -
#     travels in the request BODY and is never represented at this edge, which
#     is precisely why read-only introspection is a POST: a raw grant secret
#     must never reach a path, a query string, a log line or a referrer. This
#     proxy never inspects, parses, logs or rewrites that body.
#   * browser  (`/v2/control/organizations/...`) - the browser session cookie
#     plus the `X-OpenArc-Client` marker, `Origin` and Fetch-Metadata, with
#     `X-OpenArc-CSRF` required on the single write. `Authorization` and
#     `Proxy-Authorization` are rejected outright with 403, so no bearer of any
#     namespace can reach the human lane.
#
# The provider audience prefix is `/v2/provider/grant`, which is disjoint from
# the accepted browser listing-management prefix `/v2/provider/organizations/`,
# so a seller browser cookie can never be served by a headless provider grant
# route and vice versa.
#
# Human (browser) ids are the canonical typed ids shared with the accepted
# session, policy and action proxies: `openarc:org:` carries the identity [1-8]
# UUID version nibble, while the `openarc:grant:` namespace and the bare logical
# mutation id and provider attempt id pin UUID version 4. No grant route in the
# frozen registry is a collection list (the accepted store exposes no list
# method), so EVERY one of the nine routes rejects a literal `?` (including a
# bare `?`) by matching the original `$request_uri`, never by comparing the
# encoded `$request_uri` to the decoded `$uri`.
#
# A regex/exact `proxy_pass` here carries NO URI component, so nginx preserves
# the original encoded request target exactly once for the API to decode.
#
# Human transport reuses the unchanged tenant read/write params plus the
# marketplace response suppressor. The API remains the authority for cookie,
# exact Origin, CSRF and duplicate raw-header checks: nginx normalization here
# is transport hygiene only and never proof that the API accepted the request.
#
# Both headless audiences reuse the unchanged headless allowlist
# (`commerce_agent_proxy_params`), which forwards only Host/Authorization/Accept;
# the bounded Content-Type/Content-Length and, on the two mutating POSTs only,
# the Idempotency-Key are added by the individual locations. Every browser
# credential (Cookie, Origin, Fetch-Metadata site/mode/dest/user,
# X-OpenArc-Client marker, CSRF, Proxy-Authorization and proxy-secret headers) is
# rejected locally with 403 instead of being silently stripped. No proxy retry,
# cache or disk spooling is configured and no Set-Cookie/CORS response header is
# ever surfaced.
#
# Enabling this transport authorizes nothing: the listing paymentLane stays
# unavailable and production grant issuance, introspection and claim still
# reject unverified requirements.

# --- Agent issue: POST only, exact path, exact oacs_v1_ bearer ---------------
location = /v2/agent/commerce-grants {
  if ($request_method != POST) { return 405; }
  if ($request_uri != "/v2/agent/commerce-grants") { return 400; }
  if ($http_cookie != "") { return 403; }
  if ($http_origin != "") { return 403; }
  if ($http_sec_fetch_site != "") { return 403; }
  if ($http_sec_fetch_mode != "") { return 403; }
  if ($http_sec_fetch_dest != "") { return 403; }
  if ($http_sec_fetch_user != "") { return 403; }
  if ($http_x_openarc_client != "") { return 403; }
  if ($http_x_openarc_csrf != "") { return 403; }
  if ($http_proxy_authorization != "") { return 403; }
  if ($http_x_openarc_proxy_secret != "") { return 403; }
  if ($http_authorization !~ "^Bearer oacs_v1_[A-Za-z0-9_-]{43}$") { return 403; }
  if ($http_content_type !~ "^application/json(; *charset=utf-8)?$") { return 415; }
  if ($http_transfer_encoding != "") { return 400; }
  if ($http_idempotency_key = "") { return 400; }
  client_max_body_size 16k;
  include /etc/nginx/commerce_agent_proxy_params;
  proxy_pass_request_body on;
  proxy_set_header Content-Type $http_content_type;
  proxy_set_header Content-Length $http_content_length;
  proxy_set_header Idempotency-Key $http_idempotency_key;
  include /etc/nginx/market_response_headers;
  proxy_pass https://${API_UPSTREAM_HOST};
}

