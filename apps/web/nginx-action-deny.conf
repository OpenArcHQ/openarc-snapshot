# Commerce-action fail-closed fallbacks.
#
# Always installed by the API-enabled templates (unconditionally, even when the
# commerce-action business include is empty) and by the no-API template. Every
# malformed, disabled or lookalike action/capability path is denied locally with
# 404 so it can never be proxied and can never fall through to the SPA shell.
#
# These are plain PREFIX locations, never `^~`: an exact `=` match beats any
# prefix and a matching regex location still overrides a plain prefix, so the
# enabled exact agent authorize route, the anchored agent detail/mutation
# regexes and the exact capability route stay reachable while
# `/v2/public/action-capabilitiesXYZ`, `/v2/agent/commerce-actionsXYZ` and
# `/v2/agent/commerce-action-mutationsXYZ` lookalikes are denied. `^~` would
# disable that override and let a crafted subpath reach the deny instead of the
# enabled route.
#
# The prefixes cover ONLY the commerce-action families and never a broad
# `/v2/agent` prefix, which would shadow the accepted commerce-session agent
# routes (`/v2/agent/commerce-sessions/exchange`,
# `/v2/agent/commerce-session-mutations/:mutationId`) and the unrelated legacy
# agent surfaces.
#
# The nine browser `commerce_action_management` routes live under
# `/v2/control/organizations/...`, whose family root is already denied
# unconditionally by `nginx-control-deny.conf` (`location /v2/control`). That
# deny is not restated here: a duplicate `location /v2/control` would be a
# configuration error, and the existing plain prefix already fails every
# malformed or disabled action management subpath closed while the anchored
# regexes above it still win.

location /v2/public/action-capabilities { return 404; }
location /v2/agent/commerce-actions { return 404; }
location /v2/agent/commerce-action-mutations { return 404; }
