# Exact session-capability metadata route (API-enabled templates only).
#
# Unconditionally installed in every API-enabled template regardless of the
# VITE_COMMERCE_SESSIONS_ENABLED business flag: the API boundary owns it. It is
# method-exact, query-free (an exact $request_uri comparison, so a bare `?` is
# rejected too), body-free and credential-free, and forwards to the same exact
# upstream path with verified TLS/SNI/trust and a bounded read. No manifest is
# fabricated locally and no SPA fallback exists for this path.

location = /v2/public/session-capabilities {
  if ($request_method != GET) { return 405; }
  if ($request_uri != "/v2/public/session-capabilities") { return 400; }
  if ($http_transfer_encoding != "") { return 400; }
  if ($http_content_length != "") { return 400; }
  if ($http_content_type != "") { return 400; }
  if ($http_cookie != "") { return 403; }
  if ($http_authorization != "") { return 403; }
  if ($http_proxy_authorization != "") { return 403; }
  if ($http_x_openarc_csrf != "") { return 403; }
  if ($http_idempotency_key != "") { return 403; }
  if ($http_x_openarc_proxy_secret != "") { return 403; }
  client_max_body_size 1k;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_pass_request_headers off;
  proxy_set_header Host ${API_UPSTREAM_HOST};
  proxy_set_header Accept $http_accept;
  proxy_set_header Cookie "";
  proxy_set_header Authorization "";
  proxy_set_header X-OpenArc-CSRF "";
  proxy_set_header Idempotency-Key "";
  proxy_set_header X-OpenArc-Proxy-Secret "";
  proxy_set_header X-OpenArc-Proxy-Client-IP "";
  proxy_set_header X-Real-IP "";
  proxy_set_header X-Forwarded-For "";
  proxy_set_header X-Forwarded-Proto "";
  proxy_set_header X-Forwarded-Host "";
  proxy_set_header Forwarded "";
  proxy_set_header Content-Type "";
  proxy_set_header Content-Length "";
  proxy_set_header Transfer-Encoding "";
  proxy_ssl_server_name on;
  proxy_ssl_verify on;
  proxy_ssl_verify_depth 3;
  proxy_pass https://${API_UPSTREAM_HOST}/v2/public/session-capabilities;
  include /etc/nginx/market_response_headers;
  proxy_request_buffering off;
  proxy_pass_request_body off;
  proxy_buffering off;
  proxy_max_temp_file_size 0;
  proxy_connect_timeout 5s;
  proxy_send_timeout 5s;
  proxy_read_timeout 5s;
  proxy_next_upstream off;
}
