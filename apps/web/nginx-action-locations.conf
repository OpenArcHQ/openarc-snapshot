# Commerce-action HTTP transport enabled (VITE_COMMERCE_ACTIONS_ENABLED).
#
# EXACTLY the twelve frozen ACTION_ROUTES from
# packages/shared/src/commerce/control-action-capabilities.ts, one nginx
# location per route (9 browser `commerce_action_management` + 3 agent
# `commerce_action_authorization`):
#   GET  /v2/control/organizations/:organizationId/actions
#   GET  /v2/control/organizations/:organizationId/actions/:actionId
#   GET  /v2/control/organizations/:organizationId/approvals
#   GET  /v2/control/organizations/:organizationId/approvals/:approvalId
#   GET  /v2/control/organizations/:organizationId/agents/:subjectAgentId/policies/:policyId/exposure
#   GET  /v2/control/organizations/:organizationId/action-mutations/:mutationId
#   POST /v2/control/organizations/:organizationId/actions/:actionId/approve
#   POST /v2/control/organizations/:organizationId/actions/:actionId/reject
#   POST /v2/control/organizations/:organizationId/actions/:actionId/cancel
#   POST /v2/agent/commerce-actions
#   GET  /v2/agent/commerce-actions/:actionId
#   GET  /v2/agent/commerce-action-mutations/:mutationId
#
# No route in the frozen registry shares a path across GET and POST, so this
# family declares NO `error_page 418 = @name` dispatch and NO named location:
# every one of the twelve routes is a single externally addressable location
# with one pinned method. A named dispatch here would be dead configuration.
# (The accepted commerce-session and policy-management families do carry one,
# because their collections really are mixed-method.)
#
# Human (browser) ids are the canonical typed ids shared with the accepted
# session and policy proxies: `openarc:org:`, `openarc:agent:` and
# `openarc:policy:` carry the identity [1-8] UUID version nibble, while the new
# `openarc:action:` and `openarc:approval:` namespaces and the bare logical
# mutation id pin UUID version 4. Only the two human collection lists
# (`/actions`, `/approvals`) accept a raw query; every other route rejects a
# literal `?` (including a bare `?`) by matching the original `$request_uri`,
# never by comparing the encoded `$request_uri` to the decoded `$uri`.
#
# A regex/exact `proxy_pass` here carries NO URI component, so nginx preserves
# the original encoded request target exactly once for the API to decode.
#
# Human transport reuses the unchanged tenant read/write params plus the
# marketplace response suppressor. The API remains the authority for cookie,
# Origin, CSRF and duplicate raw-header checks: nginx normalization here is
# transport hygiene only and never proof that the API accepted the request.
#
# Agent transport is the separate headless allowlist
# (`commerce_agent_proxy_params`) for the exact three agent routes only. It
# forwards Host/Authorization/Accept and, on the POST authorization only, the
# bounded Content-Type/Content-Length/Idempotency-Key. Every browser credential
# (Cookie, Origin, Fetch-Metadata site/mode/dest/user, X-OpenArc-Client marker,
# CSRF, Proxy-Authorization and proxy-secret headers) is rejected locally with
# 403 instead of being silently stripped; only the exact `oacs_v1_` bearer
# namespace is accepted. The browser UI never carries an agent bearer. No proxy
# retry, cache or disk spooling is configured and no Set-Cookie/CORS response
# header is ever surfaced.
#
# Enabling this transport authorizes nothing: the listing paymentLane stays
# unavailable and production action authorization still rejects unverified
# requirements.

# --- Human action list: GET only, raw query (bounded read) ------------------
location ~ "^/v2/control/organizations/openarc:org:[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/actions$" {
  if ($request_method != GET) { return 405; }
  if ($http_authorization != "") { return 403; }
  if ($http_proxy_authorization != "") { return 403; }
  if ($http_x_openarc_csrf != "") { return 400; }
  if ($http_idempotency_key != "") { return 400; }
  set $openarc_action_body_ok 1;
  if ($http_content_length != "") { set $openarc_action_body_ok 0; }
  if ($http_content_length = "0") { set $openarc_action_body_ok 1; }
  if ($http_transfer_encoding != "") { set $openarc_action_body_ok 0; }
  if ($openarc_action_body_ok = 0) { return 400; }
  client_max_body_size 1k;
  include /etc/nginx/tenant_proxy_params;
  include /etc/nginx/market_response_headers;
  proxy_pass https://${API_UPSTREAM_HOST};
}

