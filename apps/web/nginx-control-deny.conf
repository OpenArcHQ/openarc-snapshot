# Control fail-closed fallbacks.
#
# Always included by the API-enabled templates (unconditionally, even when the
# policy-management include is empty) and by the no-API template. Every
# malformed, disabled or lookalike control path is denied locally with 404 so it
# can never be proxied and can never fall through to the SPA shell.
#
# These are plain PREFIX locations, never `^~`: a matching regex location still
# overrides a plain prefix, and an exact `=` match beats any prefix, so the
# enabled anchored policy routes and the exact capability route stay reachable
# while `/v2/controlXYZ` and `/v2/public/control-capabilitiesXYZ` lookalikes are
# denied.

location /v2/control { return 404; }
location /v2/public/control-capabilities { return 404; }
