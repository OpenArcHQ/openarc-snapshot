# Authorization-grant fail-closed fallbacks.
#
# Always installed by the API-enabled templates (unconditionally, even when the
# grant business include is empty) and by the no-API template. Every malformed,
# disabled or lookalike grant/capability path is denied locally with 404 so it
# can never be proxied and can never fall through to the SPA shell.
#
# These are plain PREFIX locations, never `^~`: an exact `=` match beats any
# prefix and a matching regex location still overrides a plain prefix, so the
# enabled exact agent-issue and provider introspect/claim routes and the
# anchored replace / mutation / attempt regexes stay reachable while
# `/v2/public/grant-capabilitiesXYZ`, `/v2/agent/commerce-grantsXYZ`,
# `/v2/agent/commerce-grant-mutationsXYZ` and `/v2/provider/grantsXYZ`
# lookalikes are denied. `^~` would disable that override and let a crafted
# subpath reach the deny instead of the enabled route.
#
# The prefixes cover ONLY the grant families. There is deliberately no broad
# `/v2/agent` prefix, which would shadow the accepted commerce-session agent
# routes (`/v2/agent/commerce-sessions/exchange`,
# `/v2/agent/commerce-session-mutations/:mutationId`) and the accepted
# commerce-action agent routes. There is likewise no broad `/v2/provider`
# prefix: the grant deny uses exactly the frozen provider audience prefix
# `/v2/provider/grant`, which is disjoint from the accepted browser
# listing-management prefix `/v2/provider/organizations/`, so the seller listing
# lane is untouched. (`/v2/provider` itself is already denied unconditionally by
# the accepted `nginx-market-deny.conf`; restating that exact prefix here would
# be a duplicate-location configuration error.)
#
# The three browser `commerce_grant_management` routes live under
# `/v2/control/organizations/...`, whose family root is already denied
# unconditionally by `nginx-control-deny.conf` (`location /v2/control`). That
# deny is not restated here for the same duplicate-location reason: the existing
# plain prefix already fails every malformed or disabled grant management
# subpath closed while the anchored regexes above it still win.

location /v2/public/grant-capabilities { return 404; }
location /v2/agent/commerce-grants { return 404; }
location /v2/agent/commerce-grant-mutations { return 404; }
location /v2/provider/grant { return 404; }
