# Commerce-session fail-closed fallbacks.
#
# Always installed by the API-enabled templates (unconditionally, even when the
# commerce-session business include is empty) and by the no-API template. Every
# malformed, disabled or lookalike session/capability path is denied locally
# with 404 so it can never be proxied and can never fall through to the SPA
# shell.
#
# These are plain PREFIX locations, never `^~`: a matching exact `=` match beats
# any prefix and a regex location still overrides a plain prefix, so the enabled
# exact agent exchange, the anchored agent mutation regex, the human regex
# routes and the exact capability route stay reachable while
# `/v2/public/session-capabilitiesXYZ`, `/v2/agent/commerce-sessionsXYZ` and
# `/v2/agent/commerce-session-mutationsXYZ` lookalikes are denied. The prefixes
# cover ONLY the commerce-session families and never a broad `/v2/agent`
# prefix, so unrelated legacy agents are not shadowed.

location /v2/public/session-capabilities { return 404; }
location /v2/agent/commerce-sessions { return 404; }
location /v2/agent/commerce-session-mutations { return 404; }
