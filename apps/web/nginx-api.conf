server {
  listen 8080;
  server_name _;
  server_tokens off;
  access_log off;
  error_log /dev/null emerg;
  client_max_body_size 16k;

  root /usr/share/nginx/html;
  index index.html;

  proxy_ssl_name ${API_UPSTREAM_SNI};
  proxy_ssl_trusted_certificate ${API_TRUST_BUNDLE};

  add_header X-Content-Type-Options "nosniff" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Cache-Control "no-store" always;
  add_header Pragma "no-cache" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; manifest-src 'self'; media-src 'self'; object-src 'none'; script-src 'self'; style-src 'self'; worker-src 'none'" always;

  location = /healthz { include /etc/nginx/proxy_params; proxy_pass https://${API_UPSTREAM_HOST}/healthz; }
  location = /readyz { include /etc/nginx/proxy_params; proxy_pass https://${API_UPSTREAM_HOST}/readyz; }
  location = /metrics { return 404; }
  location = /v2/public/capabilities {
    if ($request_method != GET) { return 405; }
    if ($request_uri != "/v2/public/capabilities") { return 400; }
    if ($http_transfer_encoding != "") { return 400; }
    if ($http_content_length != "" ) { return 400; }
    if ($http_content_type != "") { return 400; }
    if ($http_cookie != "") { return 403; }
    if ($http_authorization != "") { return 403; }
    if ($http_x_openarc_csrf != "") { return 403; }
    if ($http_idempotency_key != "") { return 403; }
    if ($http_x_openarc_proxy_secret != "") { return 403; }
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass_request_headers off;
    proxy_set_header Host ${API_UPSTREAM_HOST};
    proxy_set_header Origin $http_origin;
    proxy_set_header X-OpenArc-Client $http_x_openarc_client;
    proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
    proxy_set_header Sec-Fetch-Mode $http_sec_fetch_mode;
    proxy_set_header Sec-Fetch-Dest $http_sec_fetch_dest;
    proxy_set_header Accept $http_accept;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header X-OpenArc-Proxy-Secret "";
    proxy_set_header X-OpenArc-Proxy-Client-IP "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header Forwarded "";
    proxy_set_header Idempotency-Key "";
    proxy_set_header X-OpenArc-Csrf "";
    proxy_set_header Content-Type "";
    proxy_set_header Content-Length "";
    proxy_set_header Transfer-Encoding "";
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_pass https://${API_UPSTREAM_HOST}/v2/public/capabilities;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Expose-Headers;
    proxy_hide_header Access-Control-Max-Age;
    proxy_hide_header Vary;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 5s;
    proxy_send_timeout 5s;
    proxy_read_timeout 5s;
    proxy_next_upstream off;
  }
  location = /v1/private/capabilities { include /etc/nginx/proxy_params; proxy_pass https://${API_UPSTREAM_HOST}/v1/private/capabilities; }
  location = /v1/private/arc/account-snapshot { include /etc/nginx/proxy_params; proxy_pass https://${API_UPSTREAM_HOST}/v1/private/arc/account-snapshot; }
  location = /v1/private/arc/transaction-evidence { include /etc/nginx/proxy_params; proxy_pass https://${API_UPSTREAM_HOST}/v1/private/arc/transaction-evidence; }
  location = /v1/private/arc/agent-registry-evidence { include /etc/nginx/proxy_params; proxy_pass https://${API_UPSTREAM_HOST}/v1/private/arc/agent-registry-evidence; }
  location = /v1/private/arc/job-evidence { include /etc/nginx/proxy_params; proxy_pass https://${API_UPSTREAM_HOST}/v1/private/arc/job-evidence; }
  location = /v1/private/gateway/transfer-evidence { include /etc/nginx/proxy_params; proxy_pass https://${API_UPSTREAM_HOST}/v1/private/gateway/transfer-evidence; }

  include /etc/nginx/conf.d/openarc-auth-locations.inc;
  include /etc/nginx/conf.d/openarc-tenant-locations.inc;
  include /etc/nginx/conf.d/openarc-machine-locations.inc;

  # Control capability is unconditional whenever the API boundary is ON,
  # regardless of the policy-management feature flag. The policy-management
  # business include selects the direct policy API when the flag is true and is
  # copied empty when it is false. The plain-prefix deny is unconditional and
  # never `^~`, so enabled exact/regex routes still win.
  include /etc/nginx/conf.d/openarc-control-capability-locations.inc;
  include /etc/nginx/conf.d/openarc-policy-management-locations.inc;
  include /etc/nginx/conf.d/openarc-control-deny.inc;

  # Marketplace feature includes. Each is selected independently at image build
  # time; an omitted business family is copied as an empty runtime .inc so this
  # server template stays byte-identical across flag combinations. The exact
  # marketplace-capabilities GET is unconditional here regardless of the flags.
  include /etc/nginx/conf.d/openarc-market-capability-locations.inc;
  include /etc/nginx/conf.d/openarc-market-catalog-locations.inc;
  include /etc/nginx/conf.d/openarc-listing-management-locations.inc;
  include /etc/nginx/conf.d/openarc-market-moderation-locations.inc;

  # Common deny fallbacks for every disabled/malformed marketplace path. Must be
  # plain prefix locations so they never suppress the enabled anchored regexes
  # selected above (no `^~`).
  include /etc/nginx/conf.d/openarc-market-deny.inc;

  # Commerce-session family. The exact session-capability manifest is
  # unconditional whenever the API boundary is ON, regardless of the
  # VITE_COMMERCE_SESSIONS_ENABLED business flag. The business include selects
  # the seven session routes when the flag is true and is copied empty when it
  # is false. The plain-prefix deny is unconditional and never `^~`, so enabled
  # exact/regex routes still win while malformed/disabled agent and capability
  # lookalikes fail closed.
  include /etc/nginx/conf.d/openarc-session-capability-locations.inc;
  include /etc/nginx/conf.d/openarc-commerce-session-locations.inc;
  include /etc/nginx/conf.d/openarc-session-deny.inc;

  # Commerce-action family. The exact action-capability manifest is
  # unconditional whenever the API boundary is ON, regardless of the
  # VITE_COMMERCE_ACTIONS_ENABLED business flag. The business include selects
  # the twelve action routes when the flag is true and is copied empty when it
  # is false. The plain-prefix deny is unconditional and never `^~`, so enabled
  # exact/regex routes still win while malformed/disabled agent and capability
  # lookalikes fail closed. The nine browser routes sit under the existing
  # unconditional /v2/control deny, which the anchored regexes still override.
  include /etc/nginx/conf.d/openarc-action-capability-locations.inc;
  include /etc/nginx/conf.d/openarc-commerce-action-locations.inc;
  include /etc/nginx/conf.d/openarc-action-deny.inc;

  # Authorization-grant family. The exact grant-capability manifest is
  # unconditional whenever the API boundary is ON, regardless of the
  # VITE_COMMERCE_GRANTS_ENABLED business flag. The business include selects the
  # nine grant routes when the flag is true and is copied empty when it is
  # false. The plain-prefix denies are unconditional and never `^~`, so enabled
  # exact/regex routes still win while malformed/disabled agent, provider and
  # capability lookalikes fail closed. The three browser routes sit under the
  # existing unconditional /v2/control deny and the provider routes under the
  # existing unconditional /v2/provider deny, which the anchored regexes still
  # override.
  include /etc/nginx/conf.d/openarc-grant-capability-locations.inc;
  include /etc/nginx/conf.d/openarc-commerce-grant-locations.inc;
  include /etc/nginx/conf.d/openarc-grant-deny.inc;

  # Payment-attempt family (migration 0015). The exact payment-capability
  # manifest is unconditional whenever the API boundary is ON, regardless of the
  # VITE_COMMERCE_PAYMENTS_ENABLED business flag. The business include selects
  # the five payment routes when the flag is true and is copied empty when it is
  # false. The plain-prefix denies are unconditional and never `^~`. The seller
  # terms route sits under the existing unconditional /v2/provider deny, which
  # its anchored regex still overrides. No observation route exists.
  include /etc/nginx/conf.d/openarc-payment-capability-locations.inc;
  include /etc/nginx/conf.d/openarc-commerce-payment-locations.inc;
  include /etc/nginx/conf.d/openarc-payment-deny.inc;


  # Fail-closed API namespace. Without this, any /v1/ or /v2/ path that no
  # enabled route and no family deny happens to cover falls through to the SPA
  # fallback below and answers HTTP 200 text/html, so an absent or disabled
  # endpoint is indistinguishable from a working one by status code and a
  # deployment check can read the SPA shell as API success.
  #
  # These are plain PREFIX locations, never `^~`, and they are the SHORTEST
  # API prefixes in the server: nginx selects the longest matching prefix
  # first and a matching exact `=` or anchored regex location still overrides
  # a plain prefix, so every enabled route above still wins and only genuinely
  # unrouted API paths reach these. Bare `/v1` and `/v2` are matched exactly
  # because the prefixes require the trailing slash.
  location = /v1 { return 404; }
  location = /v2 { return 404; }
  location /v1/ { return 404; }
  location /v2/ { return 404; }

  location / { try_files $uri $uri/ /index.html; }
}
