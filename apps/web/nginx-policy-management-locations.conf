# Direct policy-management API enabled.
#
# EXACTLY the ten frozen CONTROL_ROUTES over eight paths (5 GET + 5 POST):
#   GET/POST  /v2/control/organizations/:orgId/policies
#   GET       /v2/control/organizations/:orgId/policies/:policyId
#   GET/POST  /v2/control/organizations/:orgId/policies/:policyId/revisions
#   GET       /v2/control/organizations/:orgId/policies/:policyId/revisions/:revision
#   POST      /v2/control/organizations/:orgId/policies/:policyId/pause
#   POST      /v2/control/organizations/:orgId/policies/:policyId/resume
#   POST      /v2/control/organizations/:orgId/policies/:policyId/revoke
#   GET       /v2/control/organizations/:orgId/policy-mutations/:mutationId
#
# Identity ids are canonical typed ids (`openarc:org:` / `openarc:policy:` with
# the shared [1-8] UUID version nibble); logical mutation ids pin UUID version 4;
# the revision is the canonical decimal 1..999999999.
#
# A regex/named `proxy_pass` carries NO URI component, so nginx preserves the
# original encoded request target (encoded ids and, for the two collection
# reads, the raw query) exactly once for the API to decode. Only the root-list
# and history collection reads accept a raw query; every other route rejects a
# literal `?` (including a bare `?`) by matching `$request_uri`, never by
# comparing the encoded `$request_uri` to the decoded `$uri`.
#
# The two combined GET/POST collections dispatch their POST verb to an internal
# only named location via `error_page 418 = @name` with a bare `return 418`
# inside `if`; no proxying directive or include is ever placed inside `if`. The
# parent itself declares the 16KiB transport bound BEFORE the dispatch, because
# nginx evaluates `client_max_body_size` for the matched parent before the
# error_page redirect; a 1k parent bound would 413 every legitimate POST body
# before the named location ran. A GET with any body still trips the body guard
# and returns 400.
#
# The API is the authority for cookie, Origin, CSRF and duplicate raw-header
# checks: nginx header normalization here is transport hygiene only and never
# proof that the API accepted the request. The API enforces the 64KiB response
# bound; this proxy never caches, retries or spools to disk.

# --- Policy collection: GET list (raw query) / POST create -------------------
location ~ "^/v2/control/organizations/openarc:org:[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/policies$" {
  error_page 418 = @openarc_policy_policies;
  if ($request_method = POST) { return 418; }
  if ($request_method != GET) { return 405; }
  if ($http_authorization != "") { return 403; }
  if ($http_proxy_authorization != "") { return 403; }
  if ($http_x_openarc_csrf != "") { return 400; }
  if ($http_idempotency_key != "") { return 400; }
  set $openarc_policy_body_ok 1;
  if ($http_content_length != "") { set $openarc_policy_body_ok 0; }
  if ($http_content_length = "0") { set $openarc_policy_body_ok 1; }
  if ($http_transfer_encoding != "") { set $openarc_policy_body_ok 0; }
  if ($openarc_policy_body_ok = 0) { return 400; }
  client_max_body_size 16k;
  include /etc/nginx/tenant_proxy_params;
  include /etc/nginx/market_response_headers;
  proxy_pass https://${API_UPSTREAM_HOST};
}

location @openarc_policy_policies {
  if ($request_method != POST) { return 405; }
  if ($http_authorization != "") { return 403; }
  if ($http_proxy_authorization != "") { return 403; }
  if ($request_uri ~ "\?") { return 400; }
  if ($http_content_type !~ "^application/json(; *charset=utf-8)?$") { return 415; }
  if ($http_transfer_encoding != "") { return 400; }
  if ($http_x_openarc_csrf = "") { return 400; }
  if ($http_idempotency_key = "") { return 400; }
  client_max_body_size 16k;
  include /etc/nginx/tenant_write_proxy_params;
  include /etc/nginx/market_response_headers;
  proxy_pass https://${API_UPSTREAM_HOST};
}

