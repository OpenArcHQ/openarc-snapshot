# Payment-attempt fail-closed fallbacks.
#
# Always installed by the API-enabled templates (even when the payment business
# include is empty) and restated in the no-API template. Every malformed,
# disabled or lookalike payment/capability path is denied locally with 404 so it
# can never be proxied and never falls through to the SPA shell.
#
# Plain PREFIX locations, never `^~`: an exact `=` match beats any prefix and a
# matching regex still overrides a plain prefix, so the enabled exact agent
# routes and the anchored dispatch/read regexes stay reachable while
# `/v2/public/payment-capabilitiesXYZ`, `/v2/agent/commerce-payment-requirementsXYZ`
# and `/v2/agent/commerce-payment-attemptsXYZ` lookalikes are denied.
#
# There is deliberately no broad `/v2/agent` prefix (it would shadow the
# accepted session, action and grant agent routes). The seller terms route lives
# under `/v2/provider/organizations/...`, whose root is already denied
# unconditionally by `nginx-market-deny.conf` (`location /v2/provider`);
# restating that exact prefix here would be a duplicate-location error.

location /v2/public/payment-capabilities { return 404; }
location /v2/agent/commerce-payment-requirements { return 404; }
location /v2/agent/commerce-payment-attempts { return 404; }
