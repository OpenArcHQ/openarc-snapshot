# Commerce-session HTTP transport enabled (VITE_COMMERCE_SESSIONS_ENABLED).
#
# EXACTLY the seven frozen SESSION_ROUTES over six paths (5 browser GET/POST
# method entries + 2 agent entries):
#   GET/POST /v2/control/organizations/:organizationId/commerce-sessions
#   GET      /v2/control/organizations/:organizationId/commerce-sessions/:sessionId
#   POST     /v2/control/organizations/:organizationId/commerce-sessions/:sessionId/revoke
#   GET      /v2/control/organizations/:organizationId/commerce-session-mutations/:mutationId
#   POST     /v2/agent/commerce-sessions/exchange
#   GET      /v2/agent/commerce-session-mutations/:mutationId
#
# Human (browser) ids: the organization id is the canonical typed
# `openarc:org:` id with the shared [1-8] UUID version nibble; the session and
# logical mutation ids are canonical UUID version 4. Only the human collection
# list accepts a raw query; every other route rejects a literal `?` (including a
# bare `?`) by matching the original `$request_uri`, never by comparing the
# encoded `$request_uri` to the decoded `$uri`.
#
# A regex/named `proxy_pass` carries NO URI component, so nginx preserves the
# original encoded request target exactly once for the API to decode.
#
# The human combined GET/POST collection dispatches its POST verb to an
# internal-only named location via `error_page 418 = @name` with a bare
# `return 418` inside `if`; no proxying directive or include is ever placed
# inside `if`. The parent declares the 16KiB transport bound BEFORE the
# dispatch, because nginx evaluates `client_max_body_size` for the matched
# parent before the error_page redirect; a 1k parent bound would 413 every
# legitimate issue body before the named location ran. A GET with any body
# still trips the body guard and returns 400.
#
# Human transport reuses the unchanged tenant read/write params plus the
# marketplace response suppressor. The API remains the authority for cookie,
# Origin, CSRF and duplicate raw-header checks: nginx normalization here is
# transport hygiene only and never proof that the API accepted the request.
#
# Agent transport is a separate headless allowlist (`commerce_agent_proxy_params`)
# for the exact two agent routes only. It forwards Host/Authorization/Accept and,
# on the POST exchange only, the bounded Content-Type/Content-Length/
# Idempotency-Key. Every browser credential (Cookie, Origin, Fetch-Metadata
# site/mode/dest/user, X-OpenArc-Client marker, CSRF, Proxy-Authorization and
# proxy-secret headers) is rejected locally with 403 instead of being silently
# stripped; only the exact `oas_ag_` bearer namespace is accepted. The API
# performs final strict length/canonical validation and current DB authority.
# The browser UI never carries an agent bearer; non-browser clients may use the
# same-origin agent endpoints directly. No proxy retry, cache or disk spooling
# is configured and no Set-Cookie/CORS response header is ever surfaced.

# --- Human collection: GET list (raw query) / POST issue --------------------
location ~ "^/v2/control/organizations/openarc:org:[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/commerce-sessions$" {
  error_page 418 = @openarc_session_issue;
  if ($request_method = POST) { return 418; }
  if ($request_method != GET) { return 405; }
  if ($http_authorization != "") { return 403; }
  if ($http_proxy_authorization != "") { return 403; }
  if ($http_x_openarc_csrf != "") { return 400; }
  if ($http_idempotency_key != "") { return 400; }
  set $openarc_session_body_ok 1;
  if ($http_content_length != "") { set $openarc_session_body_ok 0; }
  if ($http_content_length = "0") { set $openarc_session_body_ok 1; }
  if ($http_transfer_encoding != "") { set $openarc_session_body_ok 0; }
  if ($openarc_session_body_ok = 0) { return 400; }
  client_max_body_size 16k;
  include /etc/nginx/tenant_proxy_params;
  include /etc/nginx/market_response_headers;
  proxy_pass https://${API_UPSTREAM_HOST};
}

location @openarc_session_issue {
  if ($request_method != POST) { return 405; }
  if ($http_authorization != "") { return 403; }
  if ($http_proxy_authorization != "") { return 403; }
  if ($request_uri ~ "\?") { return 400; }
  if ($http_content_type !~ "^application/json(; *charset=utf-8)?$") { return 415; }
  if ($http_transfer_encoding != "") { return 400; }
  if ($http_x_openarc_csrf = "") { return 400; }
  if ($http_idempotency_key = "") { return 400; }
  client_max_body_size 16k;
  include /etc/nginx/tenant_write_proxy_params;
  include /etc/nginx/market_response_headers;
  proxy_pass https://${API_UPSTREAM_HOST};
}

# --- Human session root: GET only, query-free, session UUID v4 ---------------
location ~ "^/v2/control/organizations/openarc:org:[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/commerce-sessions/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" {
  if ($request_method != GET) { return 405; }
  if ($http_authorization != "") { return 403; }
  if ($http_proxy_authorization != "") { return 403; }
  if ($request_uri ~ "\?") { return 400; }
  if ($http_x_openarc_csrf != "") { return 400; }
  if ($http_idempotency_key != "") { return 400; }
  set $openarc_session_body_ok 1;
  if ($http_content_length != "") { set $openarc_session_body_ok 0; }
  if ($http_content_length = "0") { set $openarc_session_body_ok 1; }
  if ($http_transfer_encoding != "") { set $openarc_session_body_ok 0; }
  if ($openarc_session_body_ok = 0) { return 400; }
  client_max_body_size 1k;
  include /etc/nginx/tenant_proxy_params;
  include /etc/nginx/market_response_headers;
  proxy_pass https://${API_UPSTREAM_HOST};
}

