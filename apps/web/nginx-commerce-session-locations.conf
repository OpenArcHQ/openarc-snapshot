# --- Human mutation status: GET only, query-free, mutation UUID v4 -----------
location ~ "^/v2/control/organizations/openarc:org:[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/commerce-session-mutations/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$" {
  if ($request_method != GET) { return 405; }
  if ($http_authorization != "") { return 403; }
  if ($http_proxy_authorization != "") { return 403; }
  if ($request_uri ~ "\?") { return 400; }
  if ($http_x_openarc_csrf != "") { return 400; }
  if ($http_idempotency_key != "") { return 400; }
  set $openarc_session_body_ok 1;
  if ($http_content_length != "") { set $openarc_session_body_ok 0; }
  if ($http_content_length = "0") { set $openarc_session_body_ok 1; }
  if ($http_transfer_encoding != "") { set $openarc_session_body_ok 0; }
