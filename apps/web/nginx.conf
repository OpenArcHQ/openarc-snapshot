server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;

  add_header Cache-Control "no-store" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; worker-src 'none'; media-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  # Plain (non-API) builds fail closed for the protected organization read
  # family: no SPA fallback and no proxy for /v1/operator/organizations.
  location = /v1/operator { return 404; }
  location /v1/operator/ { return 404; }

  # Public capability metadata is only reachable through the API-enabled
  # templates. With the API boundary OFF this exact path fails closed instead
  # of falling through to the SPA shell.
  location = /v2/public/capabilities { return 404; }

  # Marketplace API paths are only reachable through the API-enabled templates.
  # With the API boundary OFF every marketplace family (and the exact
  # marketplace-capabilities route) fails closed with 404 rather than serving
  # SPA HTML. Plain prefixes are used so the exact marketplace-capabilities
  # deny still wins; no upstream reference exists in this template.
  location /v2/public/marketplace-capabilities { return 404; }
  location /v2/public/market { return 404; }
  location /v2/provider { return 404; }
  location /v2/moderator { return 404; }

  # The control policy API and the control-capability manifest are only
  # reachable through the API-enabled templates. With the API boundary OFF every
  # /v2/control path (including malformed and lookalike paths) and the exact
  # control-capability path fail closed with 404 instead of serving SPA HTML.
  # Plain prefixes keep the enabled exact/regex routes in the API templates free
  # of any `^~` suppression.
  location /v2/control { return 404; }
  location /v2/public/control-capabilities { return 404; }

  # Commerce-session API paths are only reachable through the API-enabled
  # templates. With the API boundary OFF every session family (the exact
  # session-capabilities route, the agent exchange/status paths and the
  # browser management paths already covered by the /v2/control deny) fails
  # closed with 404 rather than serving SPA HTML. Plain prefixes are used so
  # the exact session-capabilities deny still wins; no broad /v2/agent prefix
  # is denied, so unrelated legacy agents are not shadowed.
  location /v2/public/session-capabilities { return 404; }
  location /v2/agent/commerce-sessions { return 404; }
  location /v2/agent/commerce-session-mutations { return 404; }

  # Commerce-action API paths are only reachable through the API-enabled
  # templates. With the API boundary OFF every action family (the exact
  # action-capabilities route, the agent authorize/detail/status paths and the
  # browser management paths already covered by the /v2/control deny) fails
  # closed with 404 rather than serving SPA HTML. Plain prefixes are used so the
  # exact action-capabilities deny still wins; no broad /v2/agent prefix is
  # denied, so the commerce-session agent routes and unrelated legacy agents are
  # not shadowed.
  location /v2/public/action-capabilities { return 404; }
  location /v2/agent/commerce-actions { return 404; }
  location /v2/agent/commerce-action-mutations { return 404; }

  # Authorization-grant API paths are only reachable through the API-enabled
  # templates. With the API boundary OFF every grant family (the exact
  # grant-capabilities route, the agent issue/replace/status paths, the provider
  # grant prefix and the browser management paths already covered by the
  # /v2/control deny) fails closed with 404 rather than serving SPA HTML. Plain
  # prefixes are used so the exact grant-capabilities deny still wins; no broad
  # /v2/agent prefix is denied, so the commerce-session and commerce-action
  # agent routes are not shadowed, and the provider deny is exactly the frozen
  # `/v2/provider/grant` audience prefix, which never covers the seller
  # `/v2/provider/organizations/` listing lane.
  location /v2/public/grant-capabilities { return 404; }
  location /v2/agent/commerce-grants { return 404; }
  location /v2/agent/commerce-grant-mutations { return 404; }
  location /v2/provider/grant { return 404; }

  # Fail-closed API namespace. Without this, any /v1/ or /v2/ path that no
  # enabled route and no family deny happens to cover falls through to the SPA
  # fallback below and answers HTTP 200 text/html, so an absent or disabled
  # endpoint is indistinguishable from a working one by status code and a
  # deployment check can read the SPA shell as API success.
  #
  # These are plain PREFIX locations, never `^~`, and they are the SHORTEST
  # API prefixes in the server: nginx selects the longest matching prefix
  # first and a matching exact `=` or anchored regex location still overrides
  # a plain prefix, so every enabled route above still wins and only genuinely
  # unrouted API paths reach these. Bare `/v1` and `/v2` are matched exactly
  # because the prefixes require the trailing slash.
  location = /v1 { return 404; }
  location = /v2 { return 404; }
  location /v1/ { return 404; }
  location /v2/ { return 404; }


  location / {
    try_files $uri $uri/ /index.html;
  }
}
