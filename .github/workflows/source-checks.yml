name: Public source checks

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check public commit identities
        run: node scripts/check-public-history.mjs
      - name: Test public history safeguards
        run: node --test scripts/check-public-history.test.mjs
      - name: Verify source, units and development browser journeys
        run: docker build -f scripts/Dockerfile.node22-gate -t openarc-public-source-gate .
      - name: Run account, tenant, tenant-write, worker, machine, marketplace and public capability deployment tests in the built gate image
        run: |
          docker run --rm openarc-public-source-gate \
            node --test scripts/account-deployment.test.mjs scripts/tenant-deployment.test.mjs scripts/tenant-write-deployment.test.mjs scripts/tenant-ci-wiring.test.mjs scripts/worker-ci-wiring.test.mjs scripts/machine-deployment.test.mjs scripts/machine-ci-wiring.test.mjs scripts/capability-deployment.test.mjs scripts/marketplace-deployment.test.mjs scripts/marketplace-ci-wiring.test.mjs scripts/control-deployment.test.mjs scripts/session-deployment.test.mjs scripts/action-deployment.test.mjs scripts/grant-deployment.test.mjs scripts/api-namespace-deployment.test.mjs
      - name: Run real PostgreSQL database tests
        run: |
          set -euo pipefail
          DB_CONTAINER="openarc-db-test-${{ github.run_id }}-${{ github.run_attempt }}"
          cleanup() {
            docker rm -f "$DB_CONTAINER" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run -d \
            --name "$DB_CONTAINER" \
            --network none \
            --tmpfs /var/lib/postgresql/data \
            -e POSTGRES_DB=openarc_auth_test \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=openarc_disposable_test \
            postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
          ready=0
          for i in $(seq 1 30); do
            if docker exec "$DB_CONTAINER" pg_isready -U postgres -d openarc_auth_test >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo 'PostgreSQL did not become ready in time.' >&2
            exit 1
          fi
          docker run --rm \
            --network "container:$DB_CONTAINER" \
            -e OPENARC_TEST_DATABASE_URL='postgres://postgres:openarc_disposable_test@127.0.0.1:5432/openarc_auth_test' \
            openarc-public-source-gate \
            sh -c 'pnpm --filter @openarc/db test:postgres && pnpm --filter @openarc/api test:postgres && pnpm --filter @openarc/worker test:postgres && pnpm e2e:accounts'
      - name: Record verification boundary
        run: |
          echo 'Source gate passed, including real PostgreSQL database, account deployment tests, tenant and tenant-write deployment guards, worker and machine CI wiring guards and the mocked tenant write browser suite. This is not production-image or passkey tenant evidence, not an actual-production browser result, not a whole-port result, and not a production deployment or full historical release gate.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The mocked tenant write browser suite runs once inside the root development e2e gate. The e2e:tenant:writes:production alias is declared but is never executed here because the actual-production fixture is owned by a separate packet; no production database, credentials or service is used.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The mocked machine-management journeys (e2e:machine) run once immediately before the tenant write suite inside the root development e2e gate. They use synthetic browser fixtures only and are not mocked production-image acceptance. Separate production-image machine acceptance is owned by a distinct packet and is never executed here.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Private pre-publication RC objects are intentionally absent. See docs/public-source-publication.md.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Marketplace, public and protected development browser tests use synthetic HTTP fixtures; real API/DB suites use isolated PostgreSQL; reference artifacts are contract-only; separate actual production-image/browser and mainnet validation is not proved by this workflow.' >> "$GITHUB_STEP_SUMMARY"
